aid: airwavzsolutions
name: Airwavz Solutions
description: 'Airwavz Solutions is a Charlotte, North Carolina in-building wireless infrastructure company founded
  in 2013 that funds, designs, builds, owns and operates neutral-host distributed antenna systems (DAS), public
  safety emergency responder radio systems (ERRCS), managed Wi-Fi (sold as Hyperwavz), fiber backbones and private
  LTE/5G smart-building networks for commercial office, healthcare, hospitality, multifamily and event-venue properties
  across the United States, with over 154 million square feet under agreement and carrier agreements with AT&T,
  Verizon and T-Mobile. It is a physical wireless infrastructure operator rather than a software company: as of
  this profile it publishes no developer program, API documentation or machine-readable API contract, though it
  does serve an llms.txt describing the company for AI agents.'
